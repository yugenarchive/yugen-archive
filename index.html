<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>YŪGEN ARCHIVE | Historia de la Moda y Alta Costura</title>
    <meta name="description" content="Explora el legado de las grandes casas de moda. Un archivo digital sobre Chanel, Margiela y el arte del diseño.">
    <meta name="keywords" content="moda, archivo de moda, Chanel, Maison Margiela, alta costura, historia de la moda">
    <meta name="author" content="Yugen Archive">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --pink: #ffc1d6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--pink);
            color: var(--black);
            min-height: 100vh;
        }

        /* NAVEGACIÓN */
        nav {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--black);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--black);
        }

        .logo-circle {
            width: 45px;
            height: 45px;
            background-color: var(--black);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-macron {
            width: 14px;
            height: 2px;
            background-color: var(--pink);
            margin-bottom: -1px;
        }

        .logo-y {
            color: var(--pink);
            font-weight: 300;
            font-size: 2.2rem;
            line-height: 1;
            transform: scaleY(1.1);
        }

        .logo-text {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        /* GRID DE ARCHIVOS (CUADROS NEGROS) */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1px;
            background-color: var(--black);
            border-bottom: 1px solid var(--black);
        }

        .maison-card {
            background-color: var(--black);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--white);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            padding: 20px;
            text-align: center;
        }

        .maison-card:hover {
            background-color: var(--white);
            color: var(--black);
        }

        .maison-name {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            margin-bottom: 15px;
        }

        .status-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
            opacity: 0.7;
        }

        footer {
            padding: 60px 40px;
            text-align: center;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .maison-name { font-size: 2.2rem; }
            nav { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-container">
            <div class="logo-circle">
                <div class="logo-macron"></div>
                <span class="logo-y">Y</span>
            </div>
            <span class="logo-text">YŪGEN ARCHIVE</span>
        </a>
    </nav>

    <main class="archive-grid">
        <a href="chanel-article.html" class="maison-card">
            <span class="maison-name">Chanel</span>
            <span class="status-tag">Read Archive — 01</span>
        </a>

        <a href="margiela-article.html" class="maison-card">
            <span class="maison-name">Margiela</span>
            <span class="status-tag">Read Archive — 02</span>
        </a>

        <a href="#" class="maison-card" style="opacity: 0.6; cursor: default;">
            <span class="maison-name">Balenciaga</span>
            <span class="status-tag">Coming Soon</span>
        </a>
    </main>

    <footer>
        © 2026 YŪGEN ARCHIVE — ALL RIGHTS RESERVED
    </footer>

</body>
</html>
